<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Friendship Day Card | @coding.stella</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="heart-container">
      <!-- You can keep the heart or replace it with a star or smiley in the SVG -->
      <svg viewBox="0 0 100 100" width="100" height="100">
        <path class="heart" d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.9 16.7 21.4s24.7-9.5 34.2 0L50 20.5l-0.9 0.9c9.5-9.5 24.7-9.5 34.2 0s9.5 24.7 0 34.2L50 88.9z"/>
        <circle class="sparkle" cx="25" cy="25" r="2"/>
        <circle class="sparkle" cx="75" cy="25" r="2"/>
        <circle class="sparkle" cx="50" cy="15" r="2"/>
      </svg>
    </div>

    <div class="question active" id="q1">
      <h1 class="message">Will you be my best friend? 👫</h1>
      <div class="btn-container">
        <button class="btn" onclick="nextQuestion(true, 1)">Yes, always!</button>
        <div class="no-btn-container">
          <button class="btn no" onclick="handleNo()" onmouseover="dodgeNo()">Nah</button>
        </div>
      </div>
    </div>

    <div class="question" id="q2">
      <h1 class="message">Wanna hang out this Friendship Day? 🎉</h1>
      <div class="btn-container">
        <button class="btn" onclick="nextQuestion(true, 2)">Absolutely!</button>
        <div class="no-btn-container">
          <button class="btn no" onclick="handleNo()" onmouseover="dodgeNo()">Nope</button>
        </div>
      </div>
    </div>

    <div class="question" id="q3">
      <h1 class="message">Group hug? 🤗</h1>
      <div class="btn-container">
        <button class="btn" onclick="nextQuestion(true, 3)">Bring it in!</button>
        <div class="no-btn-container">
          <button class="btn no" onclick="handleNo()" onmouseover="dodgeNo()">Pass</button>
        </div> 
      </div>
    </div>

    <div class="question" id="final">
      <h1 class="message">Yay! You’re officially my bestie! 💛</h1>
    </div>

    <div class="question" id="rejected">
      <h1 class="message">😢 Oh no... still friends, right?</h1>
      <div class="btn-container">
        <button class="btn" onclick="resetQuestions()">Let’s try again</button>
      </div>
    </div>

    <div class="floating-hearts"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
<html>

<fieldset>
  <h1 class="A" id="replace">
      <div class="flosmf im ck" id="">
        
      </div>
  </h1>
</fieldset>
</html>
